name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test

  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - name: Skip migrate when Supabase secrets are missing
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN == '' || secrets.SUPABASE_PROJECT_REF == '' }}
        run: echo "Skipping Supabase migration because SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF is not set."
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: supabase db push --linked
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [check, migrate]
    steps:
      - uses: actions/checkout@v4
      - name: Skip deploy when Vercel token is missing
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: echo "Skipping Vercel deploy because VERCEL_TOKEN is not set."
      - run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        if: ${{ secrets.VERCEL_TOKEN != '' }}
